name: Core CI
description: "Runs @forager/core tests, publishes to jsr.io on main pushes"


permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    working-directory: './packages/core/'


jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - uses: './.github/actions/shared_setup'

      - name: Lint
        run: deno task lint

      - name: Test
        run: deno task test

      - name: Publishing checks
        run: deno publish --allow-slow-types --dry-run

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - uses: './.github/actions/shared_setup'

      - name: Publish package
        run: deno publish --allow-slow-types
