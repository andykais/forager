name: 'Setup Deno, FFMPEG, install dependencies'
description: 'Sets up deno, ffmpeg, install and cache dependencies'


inputs:
  DENO_VERSION:
    default: '2.9'
  FFMPEG_VERSION:
    default: '9.0'
  # macOS arm builds come from osxexperts.net, which names releases differently (e.g. ffmpeg9arm.zip)
  FFMPEG_VERSION_MACOS:
    default: '9'
  DENO_DIR:
    default: 'deno_dependency_cache'

runs:
  using: 'composite'
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: "${{ inputs.DENO_VERSION }}"

    - name: Setup FFmpeg
      uses: AnimMouse/setup-ffmpeg@v1
      with:
        version: "${{ runner.os == 'macOS' && inputs.FFMPEG_VERSION_MACOS || inputs.FFMPEG_VERSION }}"

    - name: Cache Deno dependencies 
      uses: actions/cache@v6
      with:
        path: ${{ inputs.DENO_DIR }}
        key: "deno:${{ inputs.DENO_VERSION }}:deno.lock:${{ hashFiles('deno.lock') }}"

    - name: Install deno dependencies
      run: deno install
      shell: bash
